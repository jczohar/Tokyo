.leaflet-tooltip-bottom {

}

	margin-top: -6px;
}
.leaflet-tooltip-bottom:before,

:root{--bg:#fff8f3;--ink:#2a1f3d;--mut:#6d647e;--pri:#c2185b;--pri2:#7b1fa2;--acc:#ff7043;--ok:#1e9e6a;--bad:#d32f2f;--gold:#ffd54a;--card:#fff;--line:#eadfe9;--r:16px;--hh:54px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Segoe UI",Arial,"Noto Sans Hebrew",system-ui,sans-serif;background:var(--bg);color:var(--ink);direction:rtl;line-height:1.5;font-size:16px;min-height:100vh;background-image:radial-gradient(circle at 12% 0,#ffe3ef 0,transparent 38%),radial-gradient(circle at 92% 10%,#e6e0ff 0,transparent 36%)}
body.nomove{overflow:hidden}
a{color:#7b1fa2;word-break:break-word}
h3,h4{margin:.2em 0 .4em}
.muted{color:var(--mut)}.small{font-size:.86rem}.center{text-align:center}
[lang=ja],.ja{font-family:"Noto Sans JP","Yu Gothic","Hiragino Sans",Meiryo,sans-serif;direction:ltr}

/* ---- כותרת ---- */
#top{position:sticky;top:0;z-index:50;background:linear-gradient(100deg,#2b1055 0%,#7b1fa2 45%,#e91e63 100%);color:#fff;box-shadow:0 2px 10px #0004}
.hdr{display:flex;align-items:center;gap:9px;padding:5px 10px;min-height:var(--hh)}
.hdr img{width:38px;height:38px;border-radius:10px;box-shadow:0 0 0 2px #ffd54a99;flex:none}
.hdr .tt{flex:1;min-width:0;line-height:1.15}
.hdr h1{margin:0;font-size:1.05rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.creator{font-size:.76rem;color:#e9dcff}
.creator b{color:#ffd54a;text-shadow:0 0 6px #ffb30088;letter-spacing:.3px}
.hbtn{background:#ffffff26;border:1px solid #ffffff44;color:#fff;border-radius:12px;min-width:38px;height:38px;font-size:1.05rem;cursor:pointer;position:relative;padding:0 8px}
.hbtn:hover{background:#ffffff40}
.hbtn .dot{position:absolute;top:-4px;left:-4px;background:#ff1744;color:#fff;border-radius:10px;font-size:.68rem;min-width:18px;height:18px;line-height:18px;text-align:center;font-weight:700}
.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}

/* ---- תחזית ---- */
#wx{background:linear-gradient(120deg,#fff3e0,#ffe0ec 55%,#ede7ff);border-bottom:1px solid var(--line);padding:6px 8px 7px}
.wxnow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wxbig{font-size:1.9rem;font-weight:800;line-height:1;display:flex;align-items:center;gap:6px}
.wxbig small{font-size:.78rem;font-weight:500;color:var(--mut);display:block}
.wxmeta{font-size:.8rem;color:#4b3f63;flex:1;min-width:140px}
.todaybtn{background:linear-gradient(90deg,#ff7043,#e91e63);color:#fff;border:0;border-radius:22px;padding:9px 16px;font-weight:800;font-size:.95rem;cursor:pointer;box-shadow:0 3px 10px #e91e6355;white-space:nowrap}
.wxdays{display:flex;gap:6px;overflow-x:auto;padding:6px 0 1px;scrollbar-width:thin}
.wd{flex:none;min-width:74px;background:#ffffffcc;border:1px solid var(--line);border-radius:12px;padding:4px 6px;text-align:center;font-size:.76rem}
.wd.t{border-color:#e91e63;background:#fff;box-shadow:0 0 0 2px #e91e6322}
.wd b{display:block;font-size:.78rem}.wd .e{font-size:1.3rem;line-height:1.2}.wd .r{color:#1565c0}
#alertbar{display:none;background:#fff4cc;color:#6b4a00;border-bottom:1px solid #f0d77a;padding:5px 10px;font-size:.85rem;cursor:pointer}
#alertbar.on{display:block}

/* ---- ניווט ---- */
#nav{position:sticky;top:var(--hh);z-index:40;display:flex;gap:6px;overflow-x:auto;padding:7px 8px;background:#fff;border-bottom:2px solid #f3d3e2;scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
#nav button{flex:none;border:0;background:#f6ecf6;color:#4a2a68;border-radius:20px;padding:8px 13px;font-size:.92rem;font-weight:700;cursor:pointer;white-space:nowrap;border:1.5px solid transparent}
#nav button.on{background:linear-gradient(90deg,#7b1fa2,#e91e63);color:#fff;box-shadow:0 3px 8px #7b1fa255}
main{padding:10px 10px 90px;max-width:1100px;margin:0 auto}
footer{text-align:center;padding:16px 10px 28px;background:linear-gradient(100deg,#2b1055,#7b1fa2);color:#e9dcff;font-size:.85rem}
footer b{color:#ffd54a;font-size:1rem;text-shadow:0 0 6px #ffb30088}
footer small{display:block;color:#bcaedb;margin-top:4px}

/* ---- כפתורים ושדות ---- */
.btn{background:linear-gradient(90deg,#7b1fa2,#c2185b);color:#fff;border:0;border-radius:12px;padding:9px 15px;font-size:.93rem;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.alt{background:linear-gradient(90deg,#0277bd,#00acc1)}
.btn.ghost{background:#fff;color:#6a1b9a;border:1.5px solid #d9bfe8}
.btn.bad{background:linear-gradient(90deg,#c62828,#e53935)}
.btn.small{padding:6px 11px;font-size:.82rem;border-radius:10px}
.btn.big{padding:12px 22px;font-size:1.05rem}
.btn.on{background:#1e9e6a;color:#fff;border-color:#1e9e6a}
.btn:active{transform:scale(.97)}
.inp,.ta{width:100%;border:1.5px solid #dccbe6;border-radius:11px;padding:8px 10px;font:inherit;background:#fff;color:var(--ink)}
.inp.narrow{width:auto;min-width:110px}.inp.micro{width:auto;padding:3px 6px;font-size:.82rem}
.ta{resize:vertical}
.inp:focus,.ta:focus{outline:2px solid #c2185b55;border-color:#c2185b}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}.row.wrap{flex-wrap:wrap}.row.end{justify-content:flex-end}
.col{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:8px 0}
label{font-size:.9rem}label .inp{margin-top:3px}
.fld{display:block;margin:8px 0}.fld>span{display:block;font-weight:700;font-size:.86rem;margin-bottom:3px;color:#5b3a78}
.chk{display:flex;gap:8px;align-items:center;margin:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chips.small .chip{font-size:.78rem;padding:4px 9px}
.chip{background:#fff;border:1.5px solid #d9bfe8;color:#5b3a78;border-radius:18px;padding:5px 12px;font-size:.86rem;cursor:pointer;user-select:none;display:inline-flex;gap:5px;align-items:center}
.chip.on{background:#7b1fa2;color:#fff;border-color:#7b1fa2}
.chip input{display:none}
.seg{display:flex;border:1.5px solid #d9bfe8;border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;padding:9px 4px;font:inherit;font-size:.85rem;cursor:pointer}
.seg button.on{background:#7b1fa2;color:#fff}
.sect{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:0 0 14px;box-shadow:0 2px 10px #7b1fa210}
.sect h3{font-size:1.12rem;color:#5b1a8a}
.ltools{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.lhint{font-size:.82rem;color:var(--mut);margin:4px 2px 10px}

/* ---- שדה תאריך ---- */
.dtf{display:inline-flex;align-items:center;gap:4px;direction:ltr}
.dt-text{width:128px;border:1.5px solid #dccbe6;border-radius:10px;padding:7px 9px;font:inherit;text-align:center;direction:ltr}
.dt-text.bad{border-color:#d32f2f;background:#fff0f0}
.dt-btn{position:relative;cursor:pointer;font-size:1.25rem;line-height:1;padding:4px 6px;background:#f6ecf6;border-radius:10px;overflow:hidden}
.dt-native{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}

/* ---- כרטיסים ---- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);border-top:4px solid var(--c,#c2185b);box-shadow:0 3px 12px #4a148c14;display:flex;flex-direction:column}
.ph{height:170px;background:linear-gradient(135deg,color-mix(in srgb,var(--c,#c2185b) 22%,#fff),#fff4f9);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.ph .phe{font-size:3rem;opacity:.55}
.ph.has .phe{display:none}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.evhead{font-size:2.2rem;padding:8px 12px 0;text-align:right}
.cbody{padding:10px 12px 8px;display:flex;flex-direction:column;gap:5px;flex:1}
.ctitle h3{margin:0;font-size:1.1rem;color:#2a1f3d}
.names{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.82rem;color:var(--mut);direction:ltr;justify-content:flex-end}
.names .ja{color:#c2185b}
.badges{display:flex;flex-wrap:wrap;gap:4px}
.badge{background:#f1e6f7;color:#5b3a78;border-radius:10px;padding:2px 8px;font-size:.74rem;font-weight:700}
.badge.ok{background:#d9f5e8;color:#11704a}.badge.bad{background:#ffe0e0;color:#b71c1c}.badge.gold{background:#fff0b8;color:#8a6100}.badge.area{background:#e1ecff;color:#1a4a9a}
.desc{margin:2px 0;font-size:.93rem}
.mynote{background:#fff7d6;border-radius:10px;padding:5px 9px;font-size:.85rem}
.more{display:none;border-top:1px dashed #e1cde8;margin-top:5px;padding-top:6px;font-size:.88rem}
.card.open .more{display:block}
.hist{margin:0 0 8px;color:#463a5b}
.kv{display:grid;grid-template-columns:112px 1fr;gap:6px;padding:4px 0;border-bottom:1px solid #f4eaf7}
.kv>span{font-weight:700;color:#6a3a8a;font-size:.82rem}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:auto;padding-top:6px}
.ib{background:#f6ecf6;border:0;border-radius:10px;padding:5px 9px;font:inherit;font-size:.82rem;cursor:pointer}
.ib:hover{background:#ecd9f4}
.stars{display:inline-flex;direction:ltr;margin-inline-end:auto}
.stars i{font-style:normal;font-size:1.25rem;color:#d7c9e0;cursor:pointer;padding:0 1px}
.stars i.on{color:#ffb300}
.flash{animation:fl 1.6s ease 1}@keyframes fl{0%,60%{box-shadow:0 0 0 4px #ffb300aa}100%{box-shadow:none}}

/* ---- חלון ---- */
.overlay{position:fixed;inset:0;background:#1b0f2fb0;z-index:200;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.modal{background:#fff;width:min(560px,100%);max-height:92vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .2s ease}
.modal.wide{width:min(760px,100%)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(min-width:700px){.overlay{align-items:center}.modal{border-radius:20px}}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:linear-gradient(90deg,#7b1fa2,#e91e63);color:#fff;border-radius:20px 20px 0 0}
.mhead .x,.x{background:#ffffff30;border:0;color:inherit;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:1rem}
.mbody{padding:12px 14px 16px;overflow:auto}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,30px);background:#2b1055;color:#fff;padding:10px 18px;border-radius:24px;z-index:400;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center;font-size:.9rem}
#toast.show{opacity:1;transform:translate(-50%,0)}
.dup{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#2b1055,#c2185b);padding:20px}
.dupbox{background:#fff;border-radius:22px;padding:28px;text-align:center;max-width:340px}

/* ---- מפות ---- */
.mapwrap{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:8px;margin-bottom:14px}
.maptools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.mapbox{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.map{height:58vh;min-height:340px;width:100%;background:#e8e0f0;z-index:1}.map.short{height:360px;min-height:260px}
.gframe{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:5;background:#fff}
.mapwrap.fs{position:fixed;inset:0;z-index:150;margin:0;border-radius:0;display:flex;flex-direction:column;padding:8px}
.mapwrap.fs .mapbox{flex:1}.mapwrap.fs .map{height:100%}
.btn.attn{animation:pulse 1.2s infinite;border-color:#e91e63;color:#e91e63}@keyframes pulse{50%{box-shadow:0 0 0 5px #e91e6340}}
.tilewarn{position:absolute;top:8px;right:8px;left:8px;z-index:900;background:#fff3cd;border:1px solid #e0c36a;border-radius:10px;padding:6px 10px;font-size:.82rem}
.pin{background:none;border:0}
.pinb{border-radius:50%;display:flex;align-items:center;justify-content:center;border:2.5px solid #fff;box-shadow:0 2px 6px #0006}
.stlabel{background:#fff;border:1px solid #333;font-weight:700;font-size:.72rem;padding:1px 5px}
.mapinfo,.stpanel{background:#fff;border:1.5px solid #e1cde8;border-radius:14px;padding:10px;margin-top:8px}
.mi-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.lines{margin-top:4px}.lbadge{display:inline-block;color:#fff;border-radius:7px;padding:1px 7px;font-size:.74rem;font-weight:800;text-shadow:0 0 3px #0006}
.ldot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:middle;margin-inline-end:4px}
.routebox{background:#e8f5e9;border-radius:10px;padding:8px 10px;margin:8px 0}
.strip{display:flex;gap:8px;overflow-x:auto;padding:6px 0}
.mini{flex:none;width:130px;font-size:.8rem}.mini .ph{height:80px;border-radius:10px}.mini b{display:block;margin-top:3px}.mini small{color:var(--mut)}
.mutedh{font-weight:700;color:#6a3a8a;margin-top:8px;font-size:.88rem}
.pklist details{border:1px solid var(--line);border-radius:12px;margin:6px 0;overflow:hidden}
.pklist summary{padding:8px 12px;font-weight:700;cursor:pointer;background:#f8effb}
.pkitem{display:block;width:100%;text-align:right;background:#fff;border:0;border-top:1px solid #f1e5f5;padding:8px 12px;font:inherit;cursor:pointer}
.pkitem:hover{background:#fff1f7}.pkitem small{display:block;color:var(--mut);direction:ltr;text-align:right}

/* ---- תחבורה, טיפים, טבלאות ---- */
.cards2{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.tcard{display:flex;gap:10px;background:linear-gradient(135deg,#fff,#faf2ff);border:1px solid var(--line);border-radius:14px;padding:10px}
.ticon{font-size:2rem}.tcard h4{margin:0}.tcard p{margin:3px 0;font-size:.9rem}.tcard ul{margin:4px 0;padding-inline-start:18px;font-size:.86rem}
.price{background:#fff0b8;border-radius:9px;padding:3px 8px;font-size:.86rem;font-weight:700;display:inline-block;margin:3px 0}
.facts{background:#e8f4ff;border-radius:12px;padding:9px 12px;margin-bottom:10px;font-size:.92rem}
.tipbox{border:1px solid var(--line);border-radius:12px;margin:8px 0;background:#fff}
.tipbox summary{padding:10px 12px;font-weight:800;cursor:pointer;background:linear-gradient(90deg,#fdeaf3,#f0e8ff);border-radius:12px;color:#5b1a8a}
.tipbox ul{margin:6px 0 10px;padding-inline-start:26px;font-size:.9rem}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.tbl{border-collapse:collapse;width:100%;font-size:.9rem;background:#fff}
.tbl th{background:linear-gradient(90deg,#7b1fa2,#c2185b);color:#fff;padding:8px;text-align:right;position:sticky;top:0}
.tbl td{padding:7px 8px;border-bottom:1px solid #f1e5f5;vertical-align:middle}
.tbl tr:nth-child(even) td{background:#fcf6ff}
.tbl tr[data-l]{cursor:pointer}.rom{color:#0d47a1;font-weight:600}.tbl .ja{font-size:1.05rem}

/* ---- מסלולים ---- */
.rtop{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}.rname{font-weight:800;font-size:1.05rem;max-width:300px}
.daytabs{display:flex;gap:6px;overflow-x:auto;margin:8px 0;padding-bottom:3px}
.daytabs button{flex:none;border:1.5px solid #d9bfe8;background:#fff;border-radius:14px;padding:6px 11px;font:inherit;font-size:.84rem;cursor:pointer}
.daytabs button.on{background:#7b1fa2;color:#fff;border-color:#7b1fa2}.daytabs .addday{border-style:dashed}
.dayhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#fff6e5;border-radius:12px;padding:8px 10px;margin-bottom:8px}.wxl{font-weight:700;color:#b34700}
.stop{display:flex;gap:8px;background:#fff;border:1px solid var(--line);border-inline-start:5px solid #c2185b;border-radius:12px;padding:8px;margin:2px 0;align-items:flex-start}
.stop.hotel{border-inline-start-color:#6c5ce7;background:#f3f0ff}.stop.custom{border-inline-start-color:#00b894}
.stop .tm{min-width:52px;font-weight:800;text-align:center}.tm small{display:block;font-weight:400;color:var(--mut);font-size:.72rem}
.sb{flex:1;min-width:0}.sa{display:flex;flex-direction:column;gap:3px}.sph{max-width:150px;border-radius:10px;margin-top:5px;display:block}
.leg{display:flex;gap:6px;align-items:center;font-size:.8rem;color:#4b3f63;margin:2px 14px;flex-wrap:wrap}
.mini-stops{margin:4px 0;padding-inline-start:20px;font-size:.88rem}.dayblock{margin-bottom:8px}
.savedlist .svrow{display:flex;gap:8px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:5px 0}
.warns{background:#fff4e5;border:1px solid #ffd49a;border-radius:12px;padding:8px 12px;margin:8px 0;font-size:.86rem}
.steps{font-size:.9rem}
.plan .btn.big{margin-top:6px}
#printAll{display:none}
@media print{
  body.printing>*:not(#printAll){display:none!important}
  body.printing #printAll{display:block;direction:rtl;padding:12mm;color:#000;background:#fff}
  .ptbl{width:100%;border-collapse:collapse;margin-bottom:10px}.ptbl td{border:1px solid #888;padding:4px 6px;vertical-align:top;font-size:11pt}
  body.printing{background:#fff}
}

/* ---- התראות / המרה / היום ---- */
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:9px 12px;margin:6px 0;font-size:.9rem;border:1px solid}
.alert.w{background:#fff4e5;border-color:#ffcc80}.alert.i{background:#e8f4ff;border-color:#90caf9}.alert.r{background:#ffebee;border-color:#ef9a9a}.alert.g{background:#e8f8ef;border-color:#a5d6b9}
.alert .ae{font-size:1.4rem}
.conv{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.convres{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:10px}
.convres div{background:linear-gradient(135deg,#fff0f6,#f1ecff);border-radius:12px;padding:8px;text-align:center}.convres b{display:block;font-size:1.15rem;direction:ltr}
.sugg{display:flex;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;margin:7px 0;align-items:center}
.sugg .ph{width:84px;height:70px;flex:none;border-radius:10px}.sugg .ph .phe{font-size:1.6rem}
.sugg h4{margin:0;font-size:.98rem}.sugg p{margin:2px 0;font-size:.82rem;color:var(--mut)}
@media(max-width:520px){.grid3{grid-template-columns:1fr 1fr}.kv{grid-template-columns:96px 1fr}.cards{grid-template-columns:1fr}.hdr h1{font-size:.95rem}}

{h:"✈️ הגעה מנמל התעופה וחזרה",items:[

{h:"📶 אינטרנט ותקשורת",items:[

function parseDMY(s){const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec((s||"").trim());if(!m)return"";const d=new Date(+m[3],+m[2]-1,+m[1]);if(d.getFullYear()!==+m[3]||d.getMonth()!==+m[2]-1||d.getDate()!==+m[1])return"";return m[3]+"-"+m[2]+"-"+m[1]}

function hav(a,b,c,d){const R=6371,t=x=>x*Math.PI/180;const dl=t(c-a),dn=t(d-b);const x=Math.sin(dl/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function nearestStation(lat,lng){let b=null,bd=1e9;for(const k in STATIONS){const s=STATIONS[k];const d=hav(lat,lng,s.lat,s.lng);if(d<bd){bd=d;b=k}}return{id:b,km:bd}}

let IMGC=LSget("tk_img",{});
const _imgP={};
function wikiThumb(title){
  if(!title)return Promise.resolve("");
  if(Object.prototype.hasOwnProperty.call(IMGC,title)&&IMGC[title]!=="")return Promise.resolve(IMGC[title]);
  if(_imgP[title])return _imgP[title];
  _imgP[title]=fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(title.replace(/ /g,"_")),{headers:{Accept:"application/json"}})
    .then(r=>r.ok?r.json():null).then(j=>{
      let u=j&&j.thumbnail&&j.thumbnail.source||"";
      if(u)u=u.replace(/\/(\d+)px-/,"/640px-");
      IMGC[title]=u;LSset("tk_img",IMGC);return u;
    }).catch(()=>"");
  return _imgP[title];
}
let _io=null;
function lazyImages(root){
  const els=$$(".ph[data-wiki],.ph[data-img]",root||document);
  if(!_io&&"IntersectionObserver" in window){
    _io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){_io.unobserve(e.target);loadPh(e.target)}})},{rootMargin:"250px"});
  }
  els.forEach(el=>{if(el._l)return;el._l=1;_io?_io.observe(el):loadPh(el)});
}
async function loadPh(el){
  let u=el.dataset.img||"";
  if(!u&&el.dataset.wiki)u=await wikiThumb(el.dataset.wiki);
  if(!u)return;
  const im=new Image();im.alt=el.dataset.alt||"";im.loading="lazy";
  im.onload=()=>{el.classList.add("has");el.appendChild(im)};
  im.onerror=()=>{};
  im.src=u;
}

/* דחיסה/פענוח לקישור שיתוף */
async function packState(obj){
  const json=JSON.stringify(obj);
  try{
    if("CompressionStream" in window){
      const cs=new CompressionStream("deflate-raw");const w=cs.writable.getWriter();w.write(new TextEncoder().encode(json));w.close();
      const buf=new Uint8Array(await new Response(cs.readable).arrayBuffer());
      let s="";buf.forEach(b=>s+=String.fromCharCode(b));return"z"+btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
    }
  }catch(e){}
  return"p"+btoa(unescape(encodeURIComponent(json))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
async function unpackState(str){
  const k=str[0],b=str.slice(1).replace(/-/g,"+").replace(/_/g,"/");
  const bin=atob(b+"=".repeat((4-b.length%4)%4));
  if(k==="p")return JSON.parse(decodeURIComponent(escape(bin)));
  const u8=Uint8Array.from(bin,c=>c.charCodeAt(0));
  const ds=new DecompressionStream("deflate-raw");const w=ds.writable.getWriter();w.write(u8);w.close();
  return JSON.parse(await new Response(ds.readable).text());
}

function speakJa(text){
  if(!("speechSynthesis" in window)){toast("המכשיר לא תומך בהשמעה");return}
  const u=new SpeechSynthesisUtterance(text.replace(/[！？]/g,""));u.lang="ja-JP";u.rate=.85;
  const v=speechSynthesis.getVoices().find(x=>/^ja/i.test(x.lang));if(v)u.voice=v;else if(speechSynthesis.getVoices().length)toast("לא נמצא קול יפני במכשיר — הוסיפו בהגדרות השפה");
  speechSynthesis.cancel();speechSynthesis.speak(u);
}

const MAPS={};            // מופעים פעילים
let GEO=null;             // מיקום אחרון של המשתמש {lat,lng}
const TILEPROV=[
  {u:"https://tile.openstreetmap.org/{z}/{x}/{y}.png",o:{maxZoom:19,attribution:"© OpenStreetMap"}},
  {u:"https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png",o:{subdomains:"abcd",maxZoom:19,attribution:"© OpenStreetMap © CARTO"}}
];
function addTiles(map,wrap){
  let fb=0,errs=0,layer=null;
  const warn=document.createElement("div");warn.className="tilewarn";warn.hidden=true;
  warn.innerHTML=`המפה לא נטענה כרגע (בדקו חיבור לאינטרנט). אפשר לצפות ב-<a target="_blank" rel="noopener" href="${gmapsQuery("Tokyo")}">מפות גוגל</a>.`;
  wrap.appendChild(warn);
  function use(i){
    if(layer)map.removeLayer(layer);
    layer=L.tileLayer(TILEPROV[i].u,TILEPROV[i].o).addTo(map);errs=0;
    layer.on("tileerror",()=>{errs++;if(errs>5&&fb<TILEPROV.length-1){fb++;use(fb)}else if(errs>12)warn.hidden=false});
    layer.on("tileload",()=>{warn.hidden=true});
  }
  use(0);
}
function pinIcon(emoji,color,big){
  const s=big?40:30;
  return L.divIcon({className:"pin",html:`<div class="pinb" style="background:${color};width:${s}px;height:${s}px;font-size:${big?20:15}px">${emoji}</div>`,iconSize:[s,s],iconAnchor:[s/2,s/2],popupAnchor:[0,-s/2]});
}
function destroyMap(key){if(MAPS[key]){try{MAPS[key].map.remove()}catch(e){}delete MAPS[key]}}

/* --------- בחירת מקום (רשימה לפי קטגוריות) --------- */
function allPlaces(){
  const out=[];
  const push=(cat,label,emoji,arr,mk)=>{const items=arr.filter(x=>x.lat!=null&&x.lng!=null).map(mk);if(items.length)out.push({cat,label,emoji,items})};
  push("sites","אתרים ואטרקציות","🏯",visibleItems("sites"),x=>({key:"sites:"+x.id,id:x.id,cat:"sites",name:x.he,en:x.en,lat:+x.lat,lng:+x.lng,addr:x.addr}));
  push("hotels","מלונות","🏨",visibleItems("hotels"),x=>({key:"hotels:"+x.id,id:x.id,cat:"hotels",name:x.he,en:x.en,lat:+x.lat,lng:+x.lng,addr:x.addr}));
  push("rest","מסעדות","🍣",visibleItems("rest"),x=>({key:"rest:"+x.id,id:x.id,cat:"rest",name:x.he,en:x.en,lat:+x.lat,lng:+x.lng,addr:x.addr}));
  push("shops","קניות","🛍️",visibleItems("shops"),x=>({key:"shops:"+x.id,id:x.id,cat:"shops",name:x.he,en:x.en,lat:+x.lat,lng:+x.lng,addr:x.addr}));
  push("markets","שווקים","🏮",visibleItems("markets"),x=>({key:"markets:"+x.id,id:x.id,cat:"markets",name:x.he,en:x.en,lat:+x.lat,lng:+x.lng,addr:x.addr}));
  const st=Object.keys(STATIONS).map(k=>({key:"st:"+k,id:k,cat:"st",name:"תחנת "+STATIONS[k].he,en:STATIONS[k].en,lat:STATIONS[k].lat,lng:STATIONS[k].lng,addr:STATIONS[k].ja}));
  out.push({cat:"st",label:"תחנות מטרו ורכבת",emoji:"🚇",items:st});
  return out;
}
function pickPlace(cb,title){
  const groups=allPlaces();
  let html=`<input class="inp" id="pkq" placeholder="חיפוש מקום…" autocomplete="off"><div id="pkl" class="pklist"></div>`;
  const b=openModal(title||"בחר מקום במפה",html);
  const list=$("#pkl",b);
  function draw(q){
    q=(q||"").trim().toLowerCase();
    list.innerHTML=groups.map(g=>{
      const its=g.items.filter(p=>!q||(p.name+" "+(p.en||"")).toLowerCase().includes(q));
      if(!its.length)return"";
      return `<details ${q||g.cat==="sites"?"open":""}><summary>${g.emoji} ${esc(g.label)} <small>(${its.length})</small></summary>${its.map(p=>`<button class="pkitem" data-k="${esc(p.key)}"><b>${esc(p.name)}</b><small>${esc(p.en||"")}</small></button>`).join("")}</details>`;
    }).join("")||"<p class='muted'>לא נמצאו מקומות</p>";
  }
  draw("");
  $("#pkq",b).addEventListener("input",e=>draw(e.target.value));
  list.addEventListener("click",e=>{
    const bt=e.target.closest(".pkitem");if(!bt)return;
    for(const g of groups){const p=g.items.find(x=>x.key===bt.dataset.k);if(p){closeModal();cb(p);return}}
  });
}

function placeByKey(k){for(const g of allPlaces()){const p=g.items.find(x=>x.key===k);if(p)return p}return null}
function drawLayers(){
  const M=MAPS.city;if(!M)return;M.layerGroup.clearLayers();M.markers={};
  const lay=ST.last.layers||["sites"];
  allPlaces().forEach(g=>{
    if(!lay.includes(g.cat))return;
    const [em,col]=LAYER_DEF[g.cat]||["📍","#555"];
    g.items.forEach(p=>{
      const m=L.marker([p.lat,p.lng],{icon:pinIcon(em,col)}).addTo(M.layerGroup);
      m.bindTooltip(p.name,{direction:"top",offset:[0,-14]});
      m.on("click",()=>focusPlace(p,false,true));
      M.markers[p.key]=m;
    });
  });
}

function toggleGoogle(){

function toggleFull(wrapId,btnId,key){

  try{if(on&&w.requestFullscreen&&0)w.requestFullscreen()}catch(e){}

}
function locateMe(showOnMap){
  return new Promise(res=>{
    if(!navigator.geolocation){toast("המכשיר לא תומך באיתור מיקום");res(null);return}
    navigator.geolocation.getCurrentPosition(p=>{
      GEO={lat:p.coords.latitude,lng:p.coords.longitude};
      const M=MAPS.city;
      if(showOnMap&&M){
        if(M.meMark)M.map.removeLayer(M.meMark);
        M.meMark=L.circleMarker([GEO.lat,GEO.lng],{radius:9,color:"#fff",weight:3,fillColor:"#1e90ff",fillOpacity:1}).addTo(M.map).bindTooltip("אתם כאן");
        M.map.flyTo([GEO.lat,GEO.lng],15);
      }
      res(GEO);
    },()=>{toast("אין הרשאה לאתר את המיקום. אפשר לבחור נקודת מוצא אחרת.");res(null)},{enableHighAccuracy:true,timeout:12000,maximumAge:60000});
  });
}
function routeDialog(dest){

  let mode="foot";
  $("#rmode",b).onclick=e=>{const t=e.target.closest("button");if(!t)return;mode=t.dataset.m;$$("#rmode button",b).forEach(x=>x.classList.toggle("on",x===t))};
  b.addEventListener("click",async e=>{

    else{closeModal();pickPlace(p=>doRoute({lat:p.lat,lng:p.lng,name:p.name},dest,mode),"בחר נקודת מוצא");return}
    if(!from)return;closeModal();doRoute(from,dest,mode);
  });

async function doRoute(from,dest,mode){
  const M=MAPS.city;const res=$("#miRes");
  const gm=`https://www.google.com/maps/dir/?api=1&origin=${from.lat},${from.lng}&destination=${dest.lat},${dest.lng}&travelmode=${mode==="car"?"driving":mode==="transit"?"transit":"walking"}`;
  if(!M){window.open(gm,"_blank");return}
  M.routeLayer.clearLayers();
  L.circleMarker([from.lat,from.lng],{radius:8,color:"#fff",weight:3,fillColor:"#1e90ff",fillOpacity:1}).addTo(M.routeLayer).bindTooltip(from.name||"התחלה");
  if(res)res.innerHTML=`<div class="muted">מחשב מסלול…</div>`;
  let line=null,km=null,min=null,approx=false;
  if(mode!=="transit"){
    try{
      const url=mode==="car"?`https://routing.openstreetmap.de/routed-car/route/v1/driving/${from.lng},${from.lat};${dest.lng},${dest.lat}?overview=full&geometries=geojson`:`https://routing.openstreetmap.de/routed-foot/route/v1/foot/${from.lng},${from.lat};${dest.lng},${dest.lat}?overview=full&geometries=geojson`;
      const r=await fetch(url);const j=await r.json();
      if(j&&j.routes&&j.routes[0]){const rt=j.routes[0];line=rt.geometry.coordinates.map(c=>[c[1],c[0]]);km=rt.distance/1000;min=rt.duration/60}
    }catch(e){}
  }
  if(!line){approx=true;line=[[from.lat,from.lng],[dest.lat,dest.lng]];km=hav(from.lat,from.lng,dest.lat,dest.lng)*1.25;min=mode==="foot"?km*12:mode==="car"?km*3+5:km*3.5+10}
  L.polyline(line,{color:mode==="foot"?"#e4572e":mode==="car"?"#6c5ce7":"#00b894",weight:6,opacity:.85,dashArray:approx||mode==="transit"?"8 8":null}).addTo(M.routeLayer);
  M.map.fitBounds(L.latLngBounds(line),{padding:[40,40]});
  const near=nearestStation(dest.lat,dest.lng);
  if(res)res.innerHTML=`<div class="routebox"><b>${mode==="foot"?"🚶":mode==="car"?"🚕":"🚇"} כ-${km.toFixed(1)} ק״מ · כ-${Math.round(min)} דק׳${approx?" (הערכה — קו ישר בקירוב)":""}</b>
  <div class="muted small">מ: ${esc(from.name||"")} → אל: ${esc(dest.name)}</div>
  ${mode==="transit"?`<div class="muted small">בתחבורה ציבורית — הקו המצויר מראה את הכיוון; לפירוט רכבות ושעות לחצו על הכפתור למטה. התחנה הקרובה ליעד: ${esc(STATIONS[near.id].he)} (${near.km.toFixed(1)} ק״מ).</div>`:""}
  <div class="row wrap"><a class="btn" target="_blank" rel="noopener" href="${gm}">פתיחה בגוגל מפות עם ניווט</a></div></div>`;
}

/* --------- מפת מטרו וניתוב --------- */
const TRANSFER_MIN=6;
function edgeMin(a,b,lineId){
  const A=STATIONS[a],B=STATIONS[b];const d=hav(A.lat,A.lng,B.lat,B.lng);
  const f=(lineId==="SKY"||lineId==="NEX")?1.1:2.0;return Math.max(2,d*f+1.5);
}
let _graph=null;
function graph(){
  if(_graph)return _graph;const g={};
  const add=(a,b,w,l)=>{(g[a]=g[a]||[]).push({to:b,w,line:l})};
  LINES.forEach(L=>{
    const s=L.seq;
    for(let i=0;i<s.length-1;i++){const w=edgeMin(s[i],s[i+1],L.id);add(s[i],s[i+1],w,L.id);add(s[i+1],s[i],w,L.id)}

function findPath(from,to){

/* ================= מסלולים ================= */
const MODES={walk:["🚶","הליכה"],metro:["🚇","מטרו/רכבת עירונית"],train:["🚆","רכבת/אוטובוס מרוחק"],bus:["🚌","אוטובוס"],taxi:["🚕","מונית"]};

function hotelPoint(id){

function legCalc(km,mode){
  let min,cost=0;
  if(mode==="walk"){min=km*1.3/4.5*60}
  else if(mode==="metro"){min=8+km*1.25*2;const k=km*1.25;cost=k<=6?180:k<=11?210:k<=19?260:k<=27?300:330}
  else if(mode==="train"){min=10+km*1.5;cost=Math.round((150+km*18)/10)*10}

function autoMode(km,p,stopArea){

/* ---------- בנייה אוטומטית ---------- */
function buildRoute(p){
  const hotel=hotelPoint(p.hotelId);
  const pool=visibleItems("sites").filter(s=>s.area!=="day"&&canMap(s));
  const kids=p.children>0,sen=p.seniors>0;
  pool.forEach((s,i)=>{
    let v=(pool.length-i)*.6;
    (s.tags||[]).forEach(t=>{if(p.interests.includes(t))v+=4});
    if(kids&&(s.tags||[]).includes("kids"))v+=3;
    if(kids&&(s.tags||[]).includes("night")&&!p.interests.includes("night"))v-=4;
    if((sen||p.low)&&s.walk>=3)v-=3;
    if(sen&&(s.tags||[]).includes("night"))v-=2;
    s._score=v;
  });
  const per=Math.max(2,({relaxed:3,normal:4,packed:5}[p.pace]||4)-(p.low?1:0)-(sen?0:0));
  const days=[];const used=new Set();
  const trips=[];
  if(p.daytrips&&p.days>=5){
    const cands=visibleItems("sites").filter(s=>s.area==="day"&&canMap(s));
    cands.forEach(s=>{let v=0;(s.tags||[]).forEach(t=>{if(p.interests.includes(t))v+=3});if(kids&&(s.tags||[]).includes("kids"))v+=2;if(s.id==="disney"&&!kids)v-=5;if(s.walk>=3&&(sen||p.low))v-=3;s._score=v});
    cands.sort((a,b)=>b._score-a._score);
    const n=p.days>=8?2:1;for(let i=0;i<n&&i<cands.length;i++)trips.push(cands[i]);
  }
  const tripDays={};trips.forEach((s,k)=>{let pos=Math.round((k+1)*p.days/(trips.length+1))-1;pos=Math.min(p.days-1,Math.max(1,pos));while(tripDays[pos])pos++;if(pos<p.days)tripDays[pos]=s});
  const startDate=p.start||"";
  for(let d=0;d<p.days;d++){
    const date=startDate?addDays(startDate,d):"";
    const wd=date?wdayOf(date):null;const wx=date?weatherForDate(date):null;const rainy=wx&&((wx.rain||0)>=60||wx.code>=61);
    let chosen=[];
    if(tripDays[d]){chosen=[tripDays[d]]}
    else{
      const ok=pool.filter(s=>!used.has(s.id)&&!(wd!=null&&s.closed&&s.closed.includes(wd)));
      const sc=s=>s._score+(rainy&&isIndoor(s)?3:0)-(rainy&&!isIndoor(s)?2:0);
      ok.sort((a,b)=>sc(b)-sc(a));
      if(ok.length){
        const seed=ok[0];chosen=[seed];
        const near=ok.slice(1).map(s=>({s,d:hav(seed.lat,seed.lng,s.lat,s.lng)})).filter(x=>x.d<(p.low?3.5:7)).sort((a,b)=>(a.d-sc(a.s)*.25)-(b.d-sc(b.s)*.25));
        for(const x of near){if(chosen.length>=per)break;chosen.push(x.s)}
        if(chosen.length<2){const more=ok.slice(1).filter(s=>!chosen.includes(s)).sort((a,b)=>hav(seed.lat,seed.lng,a.lat,a.lng)-hav(seed.lat,seed.lng,b.lat,b.lng));if(more[0]&&hav(seed.lat,seed.lng,more[0].lat,more[0].lng)<12)chosen.push(more[0])}
      }
    }
    chosen.forEach(s=>used.add(s.id));
    /* סדר: מוקדם ← קרוב למלון ← לילה בסוף */
    const early=chosen.filter(s=>s.id==="tsukiji"),late=chosen.filter(s=>(s.tags||[]).includes("night")&&s.id!=="tsukiji"&&chosen.length>1),mid=chosen.filter(s=>!early.includes(s)&&!late.includes(s));
    let cur=hotel||(mid[0]?{lat:mid[0].lat,lng:mid[0].lng}:null);const ordered=[];
    const rest=mid.slice();
    while(rest.length){rest.sort((a,b)=>hav(cur.lat,cur.lng,a.lat,a.lng)-hav(cur.lat,cur.lng,b.lat,b.lng));const n=rest.shift();ordered.push(n);cur={lat:n.lat,lng:n.lng}}
    const seq=[...early,...ordered,...late];
    const stops=seq.map(s=>({uid:uid(),ref:"sites:"+s.id,kind:"site",name:s.he,en:s.en,lat:s.lat,lng:s.lng,mins:Math.round((s.mins||90)*(p.pace==="packed"?.8:1)),mode:"metro",note:"",link:s.web||"",photo:"",area:s.area,early:s.id==="tsukiji",night:late.includes(s)}));
    days.push({date,stops,startTime:early.length?"08:00":(kids||sen||p.pace==="relaxed")?"09:30":"09:00"});
  }
  const route={id:"r"+Date.now(),name:"מסלול טוקיו "+p.days+" ימים",params:p,days};
  days.forEach((dy,i)=>{setAutoModes(route,i);insertLunch(route,i);recalcDay(route,i)});
  return route;
}
function prevPoint(route,day,i){
  if(i>0){const s=day.stops[i-1];return canMap(s)?{lat:+s.lat,lng:+s.lng}:null}
  return hotelPoint(route.params.hotelId);
}
function setAutoModes(route,di){
  const day=route.days[di];
  day.stops.forEach((s,i)=>{
    const a=prevPoint(route,day,i),b=pointOf(s);
    if(a&&b)s.mode=autoMode(hav(a.lat,a.lng,b.lat,b.lng),route.params,s.area);else s.mode=s.area==="day"?"train":"metro";
  });
}
function insertLunch(route,di){
  const day=route.days[di];if(day.stops.some(s=>s.kind==="meal")||day.stops.length<3)return;
  // מצא עצירה שבה הזמן עובר 12:00
  let t=toMin(day.startTime)||540;let idx=-1;
  for(let i=0;i<day.stops.length;i++){
    const a=prevPoint(route,day,i),b=pointOf(day.stops[i]);const km=a&&b?hav(a.lat,a.lng,b.lat,b.lng):0;
    t+=legCalc(km,day.stops[i].mode).min+(day.stops[i].mins||60);
    if(t>=12*60+10){idx=i;break}
  }
  if(idx<0||idx>=day.stops.length-1)idx=Math.min(1,day.stops.length-2);
  const anchor=day.stops[idx];if(!anchor||day.stops[idx].area==="day")return;
  const rs=visibleItems("rest").filter(r=>canMap(r)&&!/סושי \(Omakase\)|קאיסקי|מישלן|Omakase/i.test(r.type+" "+r.note)).map(r=>({r,d:hav(anchor.lat,anchor.lng,r.lat,r.lng)})).sort((a,b)=>a.d-b.d);
  if(!rs.length||rs[0].d>3.5)return;
  const r=rs[0].r;
  day.stops.splice(idx+1,0,{uid:uid(),ref:"rest:"+r.id,kind:"meal",name:"ארוחת צהריים: "+r.he,en:r.en,lat:r.lat,lng:r.lng,mins:60,mode:"walk",note:r.type+" · "+r.price,link:r.web||"",photo:"",area:r.area});
  setAutoModes(route,di);
}
function recalcDay(route,di){
  const day=route.days[di];let t=toMin(day.startTime)||540;
  day.stops.forEach((s,i)=>{
    const a=prevPoint(route,day,i),b=pointOf(s);
    const km=a&&b?hav(a.lat,a.lng,b.lat,b.lng):0;
    const lg=legCalc(km,s.mode);s._leg={km,min:lg.min,cost:lg.cost};
    t+=lg.min;
    if(s.fixed&&toMin(s.time)!=null)t=toMin(s.time);
    else if(s.night&&t<18*60+30)t=18*60+30;
    else if(s.early&&i===0&&t<8*60)t=8*60;
    s.time=hm(t);t+=(+s.mins||60);
  });
  day.end=hm(t);
}
function routeWarnings(route,di){
  const day=route.days[di];const w=[];if(!day.date)return w;
  const wd=wdayOf(day.date);
  day.stops.forEach(s=>{
    const it=s.ref&&s.ref.startsWith("sites:")?findItem(s.ref.slice(6)):null;
    if(it&&it.closed&&it.closed.includes(wd))w.push(`⚠️ ${s.name} סגור ב${WD[wd]} — מומלץ להחליף יום`);
    if(s.ref==="sites:tsukiji"&&wd===0)w.push("⚠️ שוק צוקיג׳י ברובו סגור בימי ראשון");
  });
  const wx=weatherForDate(day.date);
  if(wx){if((wx.rain||0)>=60||wx.code>=61)w.push("🌧️ צפוי גשם — כדאי להעדיף אתרים מקורים ולקחת מטרייה");if(wx.hi>=33)w.push("🥵 חם מאוד — שתו הרבה, תכננו הפסקות במקומות ממוזגים");if(wx.hi<=5)w.push("🥶 קר — התלבשו בשכבות");if((wx.wind||0)>=45)w.push("💨 רוחות חזקות")}
  return w;
}

let WX=LSget("tk_wx",null);          // תחזית (Open-Meteo)
let FX=LSget("tk_fx",null);          // שערי חליפין {t, jpy, eur, usd}  (כמה ין/יורו/דולר שווה שקל אחד)
const FX_DEFAULT={jpy:46,eur:0.26,usd:0.30};   // הערכה עד שמתקבל שער עדכני
const WXURL="https://api.open-meteo.com/v1/forecast?latitude=35.6762&longitude=139.6503&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max,uv_index_max,sunrise,sunset&timezone=Asia%2FTokyo&forecast_days=16";
const FXURL="https://api.frankfurter.dev/v1/latest?base=ILS&symbols=JPY,EUR,USD";
const FXURL2="https://open.er-api.com/v6/latest/ILS";

function fxRate(k){return (FX&&FX[k])||FX_DEFAULT[k]}
function ilsOf(yen){const v=yen/fxRate("jpy");return v>=100?nf(v):v.toFixed(v<10?1:0).replace(/\.0$/,"")}
function fetchJSON(u,ms){
  const c=("AbortController" in window)?new AbortController():null;const t=setTimeout(()=>c&&c.abort(),ms||12000);
  return fetch(u,c?{signal:c.signal}:{}).then(r=>{clearTimeout(t);if(!r.ok)throw 0;return r.json()});
}
async function loadWeather(force){
  const fresh=WX&&WX.t&&(Date.now()-WX.t<30*60000);
  if(fresh&&!force)return WX;
  try{
    const j=await fetchJSON(WXURL);
    if(j&&j.daily){WX=Object.assign(j,{t:Date.now()});LSset("tk_wx",WX)}
  }catch(e){}
  return WX;
}
async function loadFX(force){
  const fresh=FX&&FX.t&&(Date.now()-FX.t<6*3600000);
  if(fresh&&!force)return FX;
  let rates=null;
  try{const j=await fetchJSON(FXURL);if(j&&j.rates&&j.rates.JPY)rates={jpy:j.rates.JPY,eur:j.rates.EUR,usd:j.rates.USD}}catch(e){}
  if(!rates){try{const j=await fetchJSON(FXURL2);if(j&&j.rates&&j.rates.JPY)rates={jpy:j.rates.JPY,eur:j.rates.EUR,usd:j.rates.USD}}catch(e){}}
  if(rates){
    const old=FX&&FX.jpy;
    FX=Object.assign(rates,{t:Date.now(),prev:old&&Math.abs(old-rates.jpy)>0?old:(FX&&FX.prev)||null});
    if(!FX.base)FX.base=rates.jpy;
    LSset("tk_fx",FX);
  }
  return FX;
}

function holidayNote(iso){
  const md=iso.slice(5);const d=dateObj(iso);const wd=d.getDay();const dom=d.getDate();const m=d.getMonth()+1;
  const fixed={"01-01":"ראש השנה היפני — רוב החנויות והמסעדות סגורות 1–3 בינואר; מקדשים מלאים (האצומודה)","12-29":"תחילת ‘פגרת החגים’ (29/12–3/1): חלק מהאתרים והחנויות סגורים","12-30":"פגרת החגים — חלק מהאתרים סגורים","12-31":"ערב ראש השנה — צלצולי המקדשים (Joya no Kane)","02-11":"יום ייסוד האומה — חג ציבורי","02-23":"יום הולדת הקיסר — חג ציבורי","04-29":"פתיחת ‘שבוע הזהב’ (Golden Week) — בין 29/4 ל-5/5 המון מקומיים בכל האתרים","05-03":"Golden Week — עומס גבוה","05-04":"Golden Week — עומס גבוה","05-05":"Golden Week — יום הילד","08-11":"יום ההר — חג ציבורי","08-13":"חג ה-Obon (13–16/8) — רבים נוסעים; העיר שקטה יותר ויש פסטיבלי ריקוד","08-14":"חג ה-Obon","08-15":"חג ה-Obon","11-03":"יום התרבות — חג ציבורי","11-23":"יום ההודיה לעבודה — חג ציבורי"};
  if(fixed[md])return fixed[md];
  if(m===1&&wd===1&&dom>=8&&dom<=14)return"יום ההתבגרות — חג ציבורי";
  if(m===7&&wd===1&&dom>=15&&dom<=21)return"יום הים — חג ציבורי";
  if(m===9&&wd===1&&dom>=15&&dom<=21)return"יום כיבוד הזקנים — חג ציבורי";
  if(m===10&&wd===1&&dom>=8&&dom<=14)return"יום הספורט — חג ציבורי";
  if(m===3&&(dom===20||dom===21))return"יום השוויון האביבי — חג ציבורי (ב-20 או 21 במרץ)";
  if(m===9&&(dom===22||dom===23))return"יום השוויון הסתווי — חג ציבורי (ב-22 או 23 בספטמבר)";
  return"";
}

function monthsNear(it,m){const ms=it.months||[];return ms.includes(m)}
function todayDialog(){
  const today=tokyoToday();const wd=wdayOf(today);const w=weatherForDate(today);
  const hot=w&&w.hi>=31,rain=w&&((w.rain||0)>=55||w.code>=61),cold=w&&w.hi<=8,windy=w&&w.wind>=45;

  let html=`<p><b>${WD[wd]}, ${dmy(today)}</b>${w?` · ${wxLine(today)}`:""}</p>`;
  if(hol)html+=`<div class="alert i"><span class="ae">🎌</span><div>${esc(hol)}</div></div>`;

  }
  // 2) המלצות
  let why=[];
  if(rain)why.push("☔ צפוי גשם — מומלצים אתרים מקורים");else if(hot)why.push("🥵 חם — עדיף מקומות מקורים/מזגנים ויציאה לטבע בבוקר או לפנות ערב");else if(cold)why.push("🥶 קר — לבשו שכבות");else if(w)why.push("🌤️ מזג אוויר טוב לטיול בחוץ");
  if(windy)why.push("💨 רוח חזקה — פחות מתאים לתצפיות פתוחות");

  html+=`<div class="sect"><h3>✨ המלצות להיום</h3><div class="muted small">${why.map(esc).join(" · ")}</div>${scored.map(({s,ind})=>`<div class="sugg" data-id="${esc(s.id)}">${phHTML(s,"📍")}<div style="flex:1"><h4>${esc(s.he)}</h4><p>${esc(s.en)} · ${esc(AREAL[s.area]||"")}${ind?" · 🏠 מקורה":" · 🌳 בחוץ"}</p><p>${esc((s.desc||"").slice(0,95))}…</p></div><div class="col"><button class="ib" data-g="${esc(s.id)}">📍 מפה</button><button class="ib" data-r="${esc(s.id)}">➕ למסלול</button></div></div>`).join("")}</div>`;

  const b=openModal("🗓️ מה עושים היום",html,{wide:true});

  }
  if(m>=8&&m<=10)A.push({k:"typhoon",c:"w",e:"🌀",t:"עונת הטייפונים (אוגוסט–אוקטובר): בדקו תחזית; טייפון עלול לעצור רכבות וטיסות. עקבו אחרי jma.go.jp ואחרי הודעות המלון"});

  }
  const hol=holidayNote(today);if(hol)A.push({k:"hol"+today,c:"i",e:"🎌",t:"היום: "+hol});
  const tm=addDays(today,1);const hol2=holidayNote(tm);if(hol2)A.push({k:"hol"+tm,c:"i",e:"🎌",t:"מחר: "+hol2});
  const wd=wdayOf(today);
  const closed=SITES.filter(s=>(s.closed||[]).includes(wd)&&!isHidden("sites",s.id)).map(s=>s.he);
  if(closed.length)A.push({k:"closed"+today,c:"w",e:"🚫",t:`סגורים היום (${WD[wd]}): ${closed.slice(0,5).join(", ")}${closed.length>5?" ועוד":""}`});
  const evs=EVENTS.filter(e=>monthsNear(e,m)&&!isHidden("events",e.id)).slice(0,3);
  evs.forEach(e=>A.push({k:"ev"+e.id+m,c:"g",e:"🎭",t:`החודש: ${e.he} (${e.when})`}));
  const nx=EVENTS.filter(e=>monthsNear(e,m%12+1)&&!monthsNear(e,m)&&!isHidden("events",e.id)).slice(0,2);
  nx.forEach(e=>A.push({k:"evn"+e.id+m,c:"i",e:"📅",t:`בחודש הבא: ${e.he} (${e.when}) — כדאי לרכוש כרטיסים מראש`}));
  if(ST.cur&&ST.cur.days){
    ST.cur.days.forEach((dd,i)=>{
      if(!dd.date||dd.date<today)return;
      const w=weatherForDate(dd.date);
      if(w&&((w.rain||0)>=70||w.code>=61)&&dd.stops.some(s=>s.kind==="site"&&!isIndoor({id:s.id||""})))A.push({k:"rt"+dd.date,c:"w",e:"🧭",t:`במסלול שלכם, ${dayLabel(ST.cur,i)} (${dmy(dd.date)}): צפוי גשם — שקלו להחליף עצירות לאתרים מקורים`});

    });
  }
  return A;
}
